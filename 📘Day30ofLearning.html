

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Day 30 - CSS Animated Car</title>

  <link rel="stylesheet" href="Day30ofLearning.css">
</head>

<body>

  <div class="scene">
      <h1><i>🚗💨 Animated Road Trip</i></h1>

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud cloud1">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="cloud cloud2">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Trees -->
    <div class="tree tree1">
      <div class="leaves">🌳</div>
    </div>

    <div class="tree tree2">
      <div class="leaves">🌳</div>
    </div>

      
    <!-- Road -->
    <div class="road">
      <div class="road-line"></div>
      <!-- Car -->
      <div class="car">

        <div class="car-body">

          <div class="window window1"></div>
          <div class="window window2"></div>

          <div class="wheel wheel1"></div>
          <div class="wheel wheel2"></div>

        </div>

      </div>
      <div>
        <div class="Finish">🏁</div>
      </div>
    </div>

  </div>

</body>
