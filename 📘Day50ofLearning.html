<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Smart Notes</title>

<link rel="stylesheet" href="Day50ofLearning.css">

</head>
<body><header>
    <h1>My Smart Notes 📝</h1>
    <p>Your ideas, saved in one place ✨</p>
</header>

<main class="container">

    <section class="note-form">
        <label for="noteInput">Write your note</label>

        <textarea
            id="noteInput"
            rows="5"
            placeholder="Enter your notes here..."
        ></textarea>

        <button id="addNoteBtn">➕ Add Note</button>
    </section>

    <section class="notes-section">
        <div class="notes-header">
            <h2>My Notes 📚</h2>
            <p id="notesCounter">Total Notes: 0</p>
        </div>

        <div id="notesContainer">
            <!-- Notes will appear here -->
        </div>

        <p id="emptyMessage">No notes yet. Create your first note! ✨</p>
    </section>

</main>

<footer>
    <p>© 2026 K. Yashavanth | SKNG College, Gangavathi</p>
    <p>Built with HTML, CSS & JavaScript 💻❤️</p>
</footer>

<script src="Day50ofLearning.js"></script>

</body>
</html>
