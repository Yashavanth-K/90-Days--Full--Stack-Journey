<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>student.registration.form</title>
  <link rel="stylesheet" href="Yashu.css">
</head>
<body>
  <header>
    <h1 id="home">📋 STUDENT REGISTRATION FORM</h1>
  </header>
  <hr>
  <marquee>🚀 Welcome to Student Registration Form 🚀</marquee>
  <hr>
  <br>
  <form>
    <label class="name">Full Name:</label>
    <br>
    <input type="text" name="name" placeholder="Enter your name">
    <br>
    <br>
    <label class="email">Email:</label>
    <br>
    <input type="email" name="email" placeholder="Enter your email">
    <br>
    <br>
     <label class="password">Password:</label>
    <br>
    <input type="password" name="password" placeholder="Enter your password">
    <br>
    <br>
    <label class="gender">Gender</label> <br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br>
    <br>
    <label class="date">Date of Birth</label><br>
    <input type="date"> 
    <br>
    <br>
    <label>Course</label> <br>
<select>
      <option selected disabled>Select Course</option>
      <option>BCA</option>
      <option>B.Sc(PCM)</option>
      <option>B.Sc(CBZ)</option>
      <option>BBA</option>
      <option>BA</option>
      <option>B.Com</option>
      <option>BFSI</option>
</select>
 <br>
 <br>
 <label class="number">Phone Number</label><br>
 <input type="tel" id="number" placeholder="Enter your phone number">
 <br>
 <br>
 <label>Address:</label>
 <br>
 <textarea rows="7" cols="30"></textarea>
 <br>
 <br>
 <label class="hobbies">Hobbies</label><br>
 <input type="checkbox" name="hobbies" value="coding"> Coding
<input type="checkbox" name="hobbies" value="dancing"> Dancing
<input type="checkbox" name="hobbies" value="drawing"> Drawing
<input type="checkbox" name="hobbies" value="reading"> Reading
<br> 
 <br>
 <button type="submit" class="register">Register</button>
</form>
<hr>
<footer>
  <p>♥ © 2026 K Yashavanth ♥</p> 
  <a href="#home">⬆ Back to Top</a>
</footer>
</body>
   </html>
